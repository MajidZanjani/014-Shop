# CLOSED CANDIDATE ONLY. No app access, working archive or readiness claimed.
# Values are provisional within the proposed aggregate shop resource boundary.
data_directory = '/var/lib/shop/postgres'
hba_file = '/var/lib/shop/config/pg_hba.conf'
listen_addresses = ''
port = 5432
unix_socket_directories = '/tmp'
unix_socket_permissions = 0700
max_connections = 20
superuser_reserved_connections = 2
reserved_connections = 1
password_encryption = 'scram-sha-256'
shared_buffers = '256MB'
work_mem = '4MB'
maintenance_work_mem = '64MB'
max_worker_processes = 2
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica
wal_compression = on
max_wal_size = '1GB'
min_wal_size = '80MB'
archive_mode = on
archive_timeout = '300s'
# Deliberate failure: retain unarchived WAL; never imply a successful backup.
archive_command = 'exit 1'
archive_library = ''
logging_collector = off
log_destination = 'stderr'
log_statement = 'none'
log_min_error_statement = 'panic'
log_error_verbosity = 'terse'
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_min_duration_statement = -1
log_min_duration_sample = -1
log_duration = off
log_connections = off
log_disconnections = off
log_hostname = off
log_lock_waits = off
log_temp_files = -1
log_line_prefix = '%m [%p] %e '
shared_preload_libraries = ''
