{
  "name": "Shop ordinary development",
  "on": {
    "push": {},
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "development-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "catalog-frontend": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 12,
      "env": {
        "ASTRO_TELEMETRY_DISABLED": "1",
        "PYTHONDONTWRITEBYTECODE": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.22.0"
          }
        },
        {
          "name": "Use reviewed npm version",
          "run": "npm install --global npm@11.19.1 --no-audit --no-fund"
        },
        {
          "name": "Source authority and generated catalog",
          "run": "python3 docs/product-source/verify_t01.py all\npython3 scripts/compile_catalog.py --check"
        },
        {
          "name": "Bounded ordinary frontend and catalog checks",
          "run": "python3 scripts/check_frontend_dev.py\npython3 scripts/check_catalog.py"
        },
        {
          "name": "Browser loopback request policy controls",
          "run": "node --test tests/browser_policy.test.mjs"
        }
      ]
    },
    "backend-worker": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Install Nix for the committed toolchain lock",
          "uses": "cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b",
          "with": {
            "extra_nix_config": "experimental-features = nix-command flakes",
            "enable_kvm": false,
            "set_as_trusted_user": false,
            "install_url": "https://releases.nixos.org/nix/nix-2.34.7/install"
          }
        },
        {
          "name": "Create exclusively owned short scratch directory",
          "id": "scratch",
          "shell": "bash",
          "run": "scratch=$(mktemp -d /tmp/shop-ci-XXXXXXXX)\nchmod 700 \"$scratch\"\nprintf \"path=%s\\n\" \"$scratch\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "name": "Ordinary backend and worker checks (synthetic adapters; real isolated PostgreSQL)",
          "env": {
            "SHOP_TEST_SCRATCH": "${{ steps.scratch.outputs.path }}",
            "TMPDIR": "${{ steps.scratch.outputs.path }}"
          },
          "shell": "bash",
          "run": "nix develop --max-jobs 1 --cores 4 ./ops/nixos#backend --command python3 - <<'PY_CHECKS'\nimport subprocess\nfor script in ('scripts/check_planning.py','scripts/check_purchase_plan.py'):\n subprocess.run(['python3',script],check=True,timeout=30)\nfor pattern in ('test_check.py','test_purchase_plan_inventory.py','test_planning_activity.py','test_purchase_demo_report.py','test_browser_report.py','test_browser_control.py','test_browser_public.py'):\n subprocess.run(['python3','-m','unittest','discover','-s','tests','-p',pattern],check=True,timeout=30)\n# Each producer retains its own finite subprocess/database limits. These outer\n# limits include dependency setup and cleanup; qualification lanes stay separate.\nfor argv, timeout, marker in [\n (['python3','scripts/check_backend.py','core-local'],900,'CORE_LOCAL_PASS'),\n (['python3','scripts/check_worker.py','worker-local'],900,'WORKER_LOCAL_PASS'),\n (['python3','scripts/demo_shb.py','--check'],900,'SHB_DEMO_PASS'),\n]:\n result=subprocess.run(argv,text=True,capture_output=True,timeout=timeout)\n print(result.stdout,flush=True)\n print(result.stderr,flush=True)\n if result.returncode: raise SystemExit(result.returncode)\n if marker not in result.stdout: raise SystemExit('Required ordinary producer did not complete')\nPY_CHECKS"
        },
        {
          "name": "Remove only this job-owned scratch directory",
          "if": "always() && steps.scratch.outputs.path != ''",
          "env": {
            "SHOP_CI_OWNED_SCRATCH": "${{ steps.scratch.outputs.path }}"
          },
          "shell": "bash",
          "run": "python3 - <<'PY_CLEAN'\nimport os,shutil\nfrom pathlib import Path\np=Path(os.environ['SHOP_CI_OWNED_SCRATCH'])\nassert p.parent==Path('/tmp') and p.name.startswith('shop-ci-')\nassert not p.is_symlink() and p.is_dir() and p.stat().st_uid==os.getuid()\nshutil.rmtree(p)\nPY_CLEAN"
        }
      ]
    }
  }
}
